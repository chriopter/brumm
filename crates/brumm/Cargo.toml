[package]
name = "brumm"
version = "0.0.0"
description = "Music player for Omarchy & Linux: the daemon and the terminal player"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "brumm"
path = "src/main.rs"

[dependencies]
brumm-shared = { path = "../brumm-shared" }
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
ed25519-dalek = "=3.0.0"
flate2 = "=1.1.10"
getrandom = "=0.4.3"
htmlize = { version = "=1.1.0", features = ["unescape"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "=0.2.190"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = { version = "=0.4.46", default-features = false }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
url = "=2.5.8"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
