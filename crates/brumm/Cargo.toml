[package]
name = "brumm"
version = "0.0.0"
description = "Apple Music for Omarchy & Linux: the daemon and the terminal player"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "brumm"
path = "src/main.rs"

[dependencies]
brumm-shared = { path = "../brumm-shared" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.3"
htmlize = { version = "1.1", features = ["unescape"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
