name: release

# A pushed tag (git tag -s v0.2.0 && git push origin v0.2.0) publishes that
# version. Every push to main publishes a development build, the next patch
# version as a pre-release numbered by run (v1.5.3-dev.412); only the newest
# stays. Nobody is offered it unless brumm's "Development Builds" option is
# on. The daily check only opens a reminder issue when the latest stable
# release is three months old.
on:
  push:
    tags: ["v*"]
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

# A newer main supersedes a development build still running; version builds all finish.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: write
  id-token: write      # build attestation (Sigstore)
  attestations: write

jobs:
  remind:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: apple-token-reminder
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release age
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release_reminder.py

  # Only a push can start the build and publication jobs: a tag names its
  # release, main becomes the next patch version's development build.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Pick version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${prev#v}"
          echo "tag=v$major.$minor.$((${patch%%-*} + 1))-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  # Build against Qt 6.11, which Omarchy still ships. Arch's rolling
  # repositories may already have a newer Qt whose symbols would prevent
  # the released window from starting on Omarchy. Move this snapshot only
  # when the oldest supported Omarchy Qt moves too.
  # The window holds no secrets; the release job signs it with the rest.
  gui:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/09/30/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm base-devel git rust qt6-base qt6-declarative qt6-shadertools qt6-multimedia
          [[ $(qmake6 -query QT_VERSION) == 6.11.* ]] || { echo 'GUI build needs Qt 6.11'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          dev/build-gui dist
          readelf --version-info dist/brumm-gui | awk '
            /Name: Qt_6\./ {
              split($3, version, ".")
              if (version[2] > 11) {
                print "GUI requires newer Qt: " $3
                incompatible = 1
              }
            }
            END { exit incompatible }
          '
      - name: Test GUI
        run: |
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software /usr/lib/qt6/bin/qmltestrunner -input gui/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brumm-gui
          path: dist/brumm-gui
          if-no-files-found: error

  release:
    needs: [version, gui]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    # Actions are pinned to commits: this job holds the signing key.
    # Dependabot proposes updates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags and history for the release notes
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.version.outputs.tag != ''
        with:
          go-version-file: dev/go.mod

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.version.outputs.tag != ''
        with:
          name: brumm-gui
          path: dist/brumm

      - name: Rust tools
        if: needs.version.outputs.tag != ''
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        if: needs.version.outputs.tag != ''
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          go -C dev test ./...
          node --test crates/brumm/src/provider/tidal/web/player.test.mjs crates/brumm/src/provider/spotify/web/player.test.mjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          token=$(go -C dev run ./devtoken)
          echo "::add-mask::$token"
          mkdir -p dist/brumm
          chmod 755 dist/brumm/brumm-gui # artifacts lose the mode
          BRUMM_VERSION="$TAG" BRUMM_EMBED_DEV_TOKEN="$token" RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --locked --target x86_64-unknown-linux-musl -p brumm
          cp target/x86_64-unknown-linux-musl/release/brumm dist/brumm/brumm
          # Keep the archive layout compatible with installed updaters.
          mkdir -p dist/brumm/omarchy
          cp packaging/brumm.service packaging/brumm.desktop dist/brumm/omarchy/
          cp -r integrations/omarchy/plugin dist/brumm/omarchy/
          cp -r LICENSE README.md assets dist/brumm/
          tar -C dist -czf brumm-linux-amd64.tar.gz brumm
          cp packaging/install install.sh

      # brumm's updater installs only releases whose SHA256SUMS carries a
      # valid signature from this key; the public half is in the program.
      # The signed list names its version, so an older signed release can
      # never pass as a newer one.
      - name: Sign
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BRUMM_SIGNING_KEY: ${{ secrets.BRUMM_SIGNING_KEY }}
        run: |
          { echo "version $TAG"; sha256sum brumm-linux-amd64.tar.gz install.sh; } > SHA256SUMS
          go -C dev run ./sign ../SHA256SUMS > SHA256SUMS.sig

      # Provenance anyone can check: gh attestation verify <file> -R chriopter/brumm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.version.outputs.tag != ''
        with:
          subject-path: |
            brumm-linux-amd64.tar.gz
            install.sh

      - name: Publish
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # List commit titles since the latest stable release (never a
          # pre-release); GitHub's generated notes only summarize pull requests.
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ -n $prev ]] && git rev-parse -q --verify "$prev^{commit}" >/dev/null; then
            changes=$(git log --no-merges --format='- %s' "$prev..$GITHUB_SHA")
          else
            changes=$(git log --no-merges --format='- %s' "$GITHUB_SHA")
          fi
          dev=false
          [[ $TAG == *-dev.* ]] && dev=true
          {
            if [[ $dev == true ]]; then
              echo "The newest main, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). brumm offers it with \"Development Builds\" on in its options; the installer with:"
              echo
              echo '```'
              echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | BRUMM_TAG=$TAG bash"
              echo '```'
              echo
            fi
            if [[ -n $changes ]]; then
              echo "## Changes${prev:+ since $prev}"
              echo
              echo "$changes"
            else
              echo "No changes since $prev: a fresh build so the embedded Apple Music token stays valid."
            fi
            echo
            echo "**Update:** press <kbd>U</kbd> when brumm offers it, or run \`brumm update\`."
          } > notes.md
          # A tag with a hyphen (v0.9.0-rc1, v0.9.1-dev.412) is a pre-release:
          # never "latest", so neither the installer nor brumm's updater offers
          # it unasked.
          pre=()
          [[ $TAG == *-* ]] && pre=(--prerelease)
          if [[ $dev == true ]]; then
            # One development build at a time: the earlier ones and their tags make way.
            for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(test("-dev\\."))'); do
              [[ $old == "$TAG" ]] || gh release delete "$old" --yes --cleanup-tag || true
            done
          fi
          gh release create "$TAG" brumm-linux-amd64.tar.gz install.sh SHA256SUMS SHA256SUMS.sig \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${pre[@]}"
