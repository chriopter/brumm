name: release

# A pushed tag (git tag -s v0.2.0 && git push origin v0.2.0) publishes that
# version. Every day the workflow also checks the newest release: once it is
# 30 days old, it publishes the next patch version from main. The embedded
# Apple Music developer token is valid for six months, so a release that no
# one refreshes would stop playing; this keeps the latest one fresh.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release now even if the latest release is recent
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write      # build attestation (Sigstore)
  attestations: write

jobs:
  # Whether to release, and as what: a pushed tag, or the next patch
  # version once the latest release is 30 days old.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Pick version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh release view --json tagName,publishedAt --jq '.tagName + " " + .publishedAt' 2>/dev/null || true)
          if [[ -z $latest ]]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r tag published <<<"$latest"
          age=$(( ($(date +%s) - $(date -d "$published" +%s)) / 86400 ))
          if (( age < 30 )) && [[ ${{ inputs.force || false }} != true ]]; then
            echo "$tag is $age days old; nothing to do"
            exit 0
          fi
          IFS=. read -r major minor patch <<<"${tag#v}"
          echo "tag=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

  # Build against Qt 6.11, which Omarchy still ships. Arch's rolling
  # repositories may already have a newer Qt whose symbols would prevent
  # the released window from starting on Omarchy. Move this snapshot only
  # when the oldest supported Omarchy Qt moves too.
  # The window holds no secrets; the release job signs it with the rest.
  gui:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/09/30/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm base-devel git rust qt6-base qt6-declarative qt6-shadertools qt6-multimedia
          [[ $(qmake6 -query QT_VERSION) == 6.11.* ]] || { echo 'GUI build needs Qt 6.11'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          bin/build-gui dist
          readelf --version-info dist/brumm-gui | awk '
            /Name: Qt_6\./ {
              split($3, version, ".")
              if (version[2] > 11) {
                print "GUI requires newer Qt: " $3
                incompatible = 1
              }
            }
            END { exit incompatible }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brumm-gui
          path: dist/brumm-gui
          if-no-files-found: error

  release:
    needs: [version, gui]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    # Actions are pinned to commits: this job holds the signing key.
    # Dependabot proposes updates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags and history for the release notes
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.version.outputs.tag != ''
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.version.outputs.tag != ''
        with:
          name: brumm-gui
          path: dist/brumm

      - name: Rust tools
        if: needs.version.outputs.tag != ''
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test
        if: needs.version.outputs.tag != ''
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          go test ./tools/...

      - name: Build
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          token=$(go run ./tools/devtoken)
          echo "::add-mask::$token"
          mkdir -p dist/brumm
          chmod 755 dist/brumm/brumm-gui # artifacts lose the mode
          BRUMM_VERSION="$TAG" BRUMM_EMBED_DEV_TOKEN="$token" RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --locked --target x86_64-unknown-linux-musl -p brumm
          cp target/x86_64-unknown-linux-musl/release/brumm dist/brumm/brumm
          cp -r omarchy LICENSE README.md dist/brumm/
          tar -C dist -czf brumm-linux-amd64.tar.gz brumm
          cp bin/install install.sh

      # brumm's updater installs only releases whose SHA256SUMS carries a
      # valid signature from this key; the public half is in the program.
      # The signed list names its version, so an older signed release can
      # never pass as a newer one.
      - name: Sign
        if: needs.version.outputs.tag != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
          BRUMM_SIGNING_KEY: ${{ secrets.BRUMM_SIGNING_KEY }}
        run: |
          { echo "version $TAG"; sha256sum brumm-linux-amd64.tar.gz install.sh; } > SHA256SUMS
          go run ./tools/sign SHA256SUMS > SHA256SUMS.sig

      # Provenance anyone can check: gh attestation verify <file> -R chriopter/brumm
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.version.outputs.tag != ''
        with:
          subject-path: |
            brumm-linux-amd64.tar.gz
            install.sh

      - name: Publish
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Commits go straight to main, so list their titles; GitHub's
          # generated notes only summarize pull requests.
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -n $prev ]] && git rev-parse -q --verify "$prev^{commit}" >/dev/null; then
            changes=$(git log --no-merges --format='- %s' "$prev..$GITHUB_SHA")
          else
            changes=$(git log --no-merges --format='- %s' "$GITHUB_SHA")
          fi
          {
            if [[ -n $changes ]]; then
              echo "## Changes"
              echo
              echo "$changes"
            else
              echo "No changes since $prev: a fresh build so the embedded Apple Music token stays valid."
            fi
            echo
            echo "**Update:** press <kbd>U</kbd> when brumm offers it, or run \`brumm update\`."
          } > notes.md
          # A tag with a hyphen (v0.9.0-rc1) is a pre-release: to test, never
          # "latest", so neither the installer nor brumm's updater offers it.
          pre=()
          [[ $TAG == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" brumm-linux-amd64.tar.gz install.sh SHA256SUMS SHA256SUMS.sig \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${pre[@]}"
