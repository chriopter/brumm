# Keeps dependencies current — and keeps the repository active, which GitHub
# requires for the scheduled release workflow to keep running.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: /dev
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
