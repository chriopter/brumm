<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>brumm</title>
<script>
// brumm's playback page. Headless Chrome (with Widevine) loads it from a
// loopback origin — a secure context, which EME requires — and the daemon
// drives it through Runtime.evaluate. Commands are synchronous or
// fire-and-forget. The daemon does not poll for state: it parks one call in
// brumm.wait(), which returns the moment anything changes (and at least
// every heartbeat), so a paused player does no work at all. It polls
// brumm.spectrum() only while someone watches the visualizer.
//
// The host substitutes the configuration object for the CFG placeholder.
const CFG = __BRUMM_CFG__;
const B = window.brumm = { m: null, gen: 0, pending: null, pgen: 0, rev: 0 };

// touch says the state changed. Bursts (a song change fires half a dozen
// MusicKit events) are folded into one answer to the waiting daemon.
let waiter = null, flushing = 0;
function touch() {
  B.rev++;
  if (waiter && !flushing) flushing = setTimeout(() => { flushing = 0; if (waiter) waiter(); }, 30);
}

// The fields the daemon reads wake it when they change.
const seen = { ready: false, err: '', needsAuth: false, source: '', pv: null };
for (const k of Object.keys(seen)) {
  Object.defineProperty(B, k, { get: () => seen[k], set: (v) => { if (seen[k] !== v) { seen[k] = v; touch(); } } });
}

window.addEventListener('error', (e) => { if (!B.ready) B.err = 'page: ' + (e.message || 'script error'); });

const errText = (e) => String((e && (e.errorCode || e.name || e.message)) || e);
const isAuthError = (e) => /unauthori|not authorized|401|expired token/i.test(errText(e) + ' ' + (e && e.message));

// The listener must exist before musickit.js runs: MusicKit dispatches this
// event synchronously while its own script executes.
document.addEventListener('musickitloaded', async () => {
  try {
    // No storefrontId here: forcing one overrides the storefront MusicKit
    // derives from the user token and breaks every track with
    // CONTENT_EQUIVALENT for accounts outside that country.
    const m = await MusicKit.configure({
      developerToken: CFG.developerToken,
      app: { name: 'brumm', build: CFG.version },
    });
    // Must precede the user token. With empty storage MusicKit guesses an
    // explicit-content restriction from the storefront country, and setting
    // the token pins authorization to RESTRICTED for those countries.
    try { m.restrictedEnabled = false; } catch (_) {}
    m.musicUserToken = CFG.userToken;
    try { m.bitrate = MusicKit.PlaybackBitrate.HIGH; } catch (_) {}

    m.addEventListener('authorizationStatusDidChange', () => {
      if (!m.isAuthorized) B.needsAuth = true;
    });
    // The visualizer's AudioContext idles with the music: a running one
    // keeps Chrome's audio thread streaming silence while paused. Resumed
    // before sound plays, since the audio element is routed through it.
    m.addEventListener('playbackStateDidChange', () => {
      if (!viz.ctx) return;
      if (m.isPlaying) viz.ctx.resume();
      else if (viz.ctx.state === 'running') viz.ctx.suspend();
    });
    for (const ev of ['playbackStateDidChange', 'nowPlayingItemDidChange', 'queueItemsDidChange',
                      'queuePositionDidChange', 'playbackDurationDidChange', 'playbackVolumeDidChange',
                      'shuffleModeDidChange', 'repeatModeDidChange', 'mediaItemStateDidChange']) {
      m.addEventListener(ev, touch);
    }
    m.addEventListener('mediaPlaybackError', (e) => {
      B.err = 'playback: ' + errText(e && (e.error || e));
      if (isAuthError(e && (e.error || e))) B.needsAuth = true;
    });
    B.m = m;
    B.ready = true;
    // A play asked for while MusicKit was still loading runs now.
    if (B.autoplayOn !== undefined) B.autoplay(B.autoplayOn);
    if (B.pending) { const p = B.pending; B.pending = null; B.playIds(...p); }
    if (B.pendingStation) { const p = B.pendingStation; B.pendingStation = null; B.playStation(...p); }
  } catch (e) {
    B.err = 'musickit: ' + errText(e);
    if (isAuthError(e)) B.needsAuth = true;
  }
});

// resolve turns song ids into MusicKit items, in order: library ids
// ("i.…") from the library, everything else from the catalog, 100 per
// request and all requests at once. Ids that no longer resolve are dropped.
//
// Resolved songs are kept (known), so a song brumm warmed — the lists on
// screen are, as they open — plays without asking Apple first.
const known = new Map();
async function resolve(m, ids) {
  const jobs = [];
  const fetch = (list, path) => {
    for (let i = 0; i < list.length; i += 100) {
      jobs.push(m.api.music(path, { ids: list.slice(i, i + 100).join(',') }).then((resp) => {
        for (const it of ((resp && resp.data && resp.data.data) || [])) known.set(it.id, it);
      }).catch(() => {})); // a batch Apple refuses: the others still play
    }
  };
  const missing = ids.filter((id) => !known.has(id));
  fetch(missing.filter((id) => id.startsWith('i.')), '/v1/me/library/songs');
  // Some library songs are listed as "a.<catalog id>": the catalog knows
  // them by the number alone.
  const cat = missing.filter((id) => !id.startsWith('i.'));
  const bare = new Map(cat.map((id) => [id.startsWith('a.') ? id.slice(2) : id, id]));
  fetch([...bare.keys()], `/v1/catalog/${m.storefrontId || 'us'}/songs`);
  await Promise.all(jobs);
  for (const [b, id] of bare) if (b !== id && known.has(b)) known.set(id, known.get(b));
  // Oldest first out: a Map keeps insertion order.
  for (const id of known.keys()) {
    if (known.size <= 3000) break;
    known.delete(id);
  }
  return ids.map((id) => known.get(id)).filter(Boolean);
}

// setQueue while MusicKit is mid-seek fails with a spurious
// CONTENT_EQUIVALENT; give the seek up to 200 ms to settle.
function settle(m) {
  const P = MusicKit.PlaybackStates;
  const busy = [P.seeking, P.seekingForward, P.seekingBackward, P.waiting].filter((s) => s !== undefined);
  if (!busy.includes(m.playbackState)) return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { m.removeEventListener('playbackStateDidChange', done); resolve(); };
    m.addEventListener('playbackStateDidChange', done);
    setTimeout(done, 200);
  });
}

// dropPreview ends a preview clip without resuming what it interrupted:
// the caller is starting something else. A clip still loading is cancelled.
function dropPreview() {
  B.pgen++;
  if (viz.clip) viz.clip.pause();
  B.pv = null;
}

async function play(m) {
  try {
    await m.play();
  } catch (e) {
    // CONTENT_EQUIVALENT on resume recovers with stop+play, not a new queue.
    if (/CONTENT_EQUIVALENT/.test(errText(e))) { await m.stop(); await m.play(); } else throw e;
  }
}

// Spectrum: an AnalyserNode spliced between MusicKit's <audio> element and
// the speakers. Chrome feeds Widevine-decrypted audio through Web Audio, so
// this reflects the real signal. Built lazily, once per media element.
const viz = { ctx: null, an: null, wired: new WeakSet(), buf: null };

function analyser() {
  const el = document.querySelector('audio');
  if (!el) return null;
  if (!viz.ctx) {
    viz.ctx = new AudioContext();
    viz.an = viz.ctx.createAnalyser();
    viz.an.fftSize = 4096;
    viz.an.smoothingTimeConstant = 0.55;
    viz.an.connect(viz.ctx.destination);
    viz.buf = new Float32Array(viz.an.frequencyBinCount);
  }
  if (!viz.wired.has(el)) {
    viz.ctx.createMediaElementSource(el).connect(viz.an);
    viz.wired.add(el);
  }
  if (viz.ctx.state === 'suspended') viz.ctx.resume();
  return viz.an;
}

Object.assign(B, {
  // playIds starts startId at once — it alone is looked up before playback
  // begins — then queues the songs after it in the background. A newer
  // call supersedes an older one still loading, so presses never interleave.
  async playIds(ids, startId, source, startAt) {
    const m = B.m;
    if (!m) { B.pending = [ids, startId, source, startAt]; return; }
    dropPreview();
    const gen = ++B.gen;
    B.err = '';
    const k = Math.max(0, ids.indexOf(startId));
    try {
      let first = await resolve(m, [ids[k]]);
      let rest = ids.slice(k + 1);
      if (!first.length) {
        // The chosen song is gone: start with the next one that plays.
        const all = await resolve(m, rest);
        first = all.slice(0, 1);
        rest = all.slice(1).map((it) => it.id);
      }
      if (gen !== B.gen) return;
      if (!first.length) { B.err = 'nothing playable here'; return; }
      await settle(m);
      if (gen !== B.gen) return;
      await m.setQueue({ items: first });
      if (gen !== B.gen) return;
      B.source = source;
      await play(m);
      if (gen === B.gen && startAt > 1) await m.seekToTime(startAt);
      if (rest.length) {
        const more = await resolve(m, rest);
        if (gen === B.gen && more.length) await m.playLater({ items: more });
      }
    } catch (e) {
      if (gen !== B.gen) return;
      B.err = 'play: ' + errText(e);
      if (isAuthError(e)) B.needsAuth = true;
    }
  },
  // playStation plays a station; the queue is Apple's, endless.
  async playStation(id, source) {
    const m = B.m;
    if (!m) { B.pendingStation = [id, source]; return; }
    dropPreview();
    const gen = ++B.gen;
    B.err = '';
    try {
      await settle(m);
      if (gen !== B.gen) return;
      await m.setQueue({ station: id });
      if (gen !== B.gen) return;
      B.source = source;
      await play(m);
    } catch (e) {
      if (gen !== B.gen) return;
      B.err = 'station: ' + errText(e);
      if (isAuthError(e)) B.needsAuth = true;
    }
  },
  // warm looks songs up ahead of a play, quietly; failures do not matter.
  warm(ids) { if (B.m) resolve(B.m, ids.slice(0, 500)).catch(() => {}); },
  // autoplay keeps similar music coming after the queue ends. MusicKit
  // does not document it; where it is missing this does nothing.
  autoplay(on) {
    B.autoplayOn = on;
    if (B.m) try { B.m.autoplayEnabled = on; } catch (_) {}
  },
  // During a preview, play/pause is about the clip: toggle ends it and
  // resumes the music (as letting go of space does), pause just ends it.
  toggle() {
    const m = B.m;
    if (!m) return;
    if (B.pv) { B.stopPreview(); return; }
    if (m.isPlaying) m.pause(); else play(m).catch((e) => { B.err = 'play: ' + errText(e); });
  },
  play() {
    dropPreview();
    if (B.m && !B.m.isPlaying) play(B.m).catch((e) => { B.err = 'play: ' + errText(e); });
  },
  pause() { dropPreview(); if (B.m) B.m.pause(); },
  next() { dropPreview(); if (B.m) B.m.skipToNextItem().catch(() => {}); },
  // Previous restarts the song once it is past three seconds in, like
  // every hardware player; before that it goes back a song.
  prev() {
    const m = B.m;
    if (!m) return;
    dropPreview();
    if ((m.currentPlaybackTime || 0) > 3) m.seekToTime(0).catch(() => {});
    else m.skipToPreviousItem().catch(() => {});
  },
  // queue returns the current song and up to n after it.
  queue(n) {
    const m = B.m;
    const out = { pos: -1, items: [] };
    if (!m || !m.queue) return JSON.stringify(out);
    const items = m.queue.items || [];
    out.pos = typeof m.nowPlayingItemIndex === 'number' ? m.nowPlayingItemIndex : -1;
    for (let i = Math.max(0, out.pos); i < items.length && out.items.length < n; i++) {
      const it = items[i], a = it.attributes || {}, art = it.artwork || a.artwork;
      out.items.push({ id: it.id, title: it.title || a.name || '', artist: it.artistName || a.artistName || '',
                       album: it.albumName || a.albumName || '', duration: (it.playbackDuration || a.durationInMillis || 0) / 1000,
                       artwork: art && art.url ? MusicKit.formatArtworkURL(art, 600, 600) : '',
                       number: it.trackNumber || a.trackNumber || 0 });
    }
    return JSON.stringify(out);
  },
  jump(i) { dropPreview(); if (B.m) B.m.changeToMediaAtIndex(i).then(() => play(B.m)).catch((e) => { B.err = 'play: ' + errText(e); }); },
  // enqueue adds songs after the current one (next) or at the end.
  async enqueue(ids, next) {
    const m = B.m;
    if (!m) return;
    try {
      if (!m.queue || !m.queue.items || !m.queue.items.length) return B.playIds(ids, ids[0], 'queue:', 0);
      const items = await resolve(m, ids);
      if (!items.length) { B.err = 'nothing playable here'; return; }
      if (next) await m.playNext({ items }); else await m.playLater({ items });
    } catch (e) {
      B.err = 'queue: ' + errText(e);
    }
  },
  seek(t) { if (B.m) B.m.seekToTime(Math.max(0, t)).catch(() => {}); },
  volume(v) { if (B.m) B.m.volume = Math.max(0, Math.min(1, v)); },
  shuffle(on) { if (B.m) B.m.shuffleMode = on ? 1 : 0; },
  repeat(mode) { if (B.m) B.m.repeatMode = mode; }, // 0 off, 1 one, 2 all
  // preview plays Apple's 30-second clip of a song while the current one
  // pauses; stopPreview ends it and resumes what was playing.
  async preview(id) {
    const m = B.m;
    if (!m) return;
    const gen = ++B.pgen;
    try {
      let song;
      if (id.startsWith('i.')) {
        const r = await m.api.music(`/v1/me/library/songs/${encodeURIComponent(id)}`, { include: 'catalog' });
        const lib = r.data.data[0];
        song = (lib.relationships && lib.relationships.catalog && lib.relationships.catalog.data[0]) || lib;
      } else {
        const r = await m.api.music(`/v1/catalog/${m.storefrontId || 'us'}/songs/${encodeURIComponent(id)}`);
        song = r.data.data[0];
      }
      if (gen !== B.pgen) return;
      const a = song.attributes || {};
      const url = a.previews && a.previews[0] && a.previews[0].url;
      if (!url) { B.err = 'no preview for this song'; return; }
      const resume = (B.pv && B.pv.resume) || m.isPlaying;
      B.pv = { title: a.name || '', artist: a.artistName || '', resume,
               artwork: a.artwork ? MusicKit.formatArtworkURL(a.artwork, 600, 600) : '' };
      if (m.isPlaying) await m.pause();
      if (gen !== B.pgen) return;
      // A plain element, outside Web Audio: the clips come from another
      // origin without CORS, which Web Audio would turn into silence.
      viz.clip = viz.clip || new Audio();
      viz.clip.src = url;
      viz.clip.volume = m.volume;
      await viz.clip.play();
    } catch (e) {
      if (gen === B.pgen) B.err = 'preview: ' + errText(e);
    }
  },
  stopPreview() {
    B.pgen++;
    if (viz.clip) viz.clip.pause();
    const pv = B.pv;
    B.pv = null;
    if (pv && pv.resume && B.m) play(B.m).catch(() => {});
  },
  setToken(t) { if (B.m) { B.m.musicUserToken = t; B.needsAuth = false; B.err = ''; } },

  // wait answers with the state once it is newer than rev, or after ms.
  wait(rev, ms) {
    if (waiter) waiter(); // a stale call: answer it so it does not linger
    return new Promise((resolve) => {
      if (B.rev !== rev) { resolve(B.state()); return; }
      const done = () => { clearTimeout(t); if (waiter === done) waiter = null; resolve(B.state()); };
      const t = setTimeout(done, ms);
      waiter = done;
    });
  },

  state() {
    const m = B.m;
    const s = {
      rev: B.rev, ready: B.ready, err: B.err, needsAuth: B.needsAuth, playing: false,
      title: '', artist: '', album: '', artwork: '', pos: 0, dur: 0,
      index: -1, length: 0, source: B.source, volume: 1, id: '', shuffle: false, repeat: 0,
      preview: B.pv ? { title: B.pv.title, artist: B.pv.artist, artwork: B.pv.artwork } : null,
    };
    if (!m) return JSON.stringify(s);
    const it = m.nowPlayingItem;
    s.playing = !!m.isPlaying;
    s.volume = m.volume;
    s.shuffle = m.shuffleMode === 1;
    s.repeat = m.repeatMode || 0;
    s.pos = m.currentPlaybackTime || 0;
    s.dur = m.currentPlaybackDuration || (it && it.playbackDuration ? it.playbackDuration / 1000 : 0);
    s.index = typeof m.nowPlayingItemIndex === 'number' ? m.nowPlayingItemIndex : -1;
    s.length = m.queue && m.queue.items ? m.queue.items.length : 0;
    if (it) {
      const a = it.attributes || {};
      s.id = it.id || '';
      s.title = it.title || a.name || '';
      s.artist = it.artistName || a.artistName || '';
      s.album = it.albumName || a.albumName || '';
      const art = it.artwork || a.artwork;
      if (art && art.url) s.artwork = MusicKit.formatArtworkURL(art, 600, 600);
    }
    return JSON.stringify(s);
  },

  // wave returns n samples of the waveform, -100…100, for the oscilloscope.
  wave(n) {
    const out = new Array(n).fill(0);
    if (!B.m || !B.m.isPlaying) return out;
    const an = analyser();
    if (!an) return out;
    viz.td = viz.td || new Float32Array(an.fftSize);
    an.getFloatTimeDomainData(viz.td);
    const step = Math.max(1, Math.floor(Math.min(viz.td.length, 2048) / n));
    for (let i = 0; i < n; i++) out[i] = Math.round(100 * viz.td[i * step]);
    return out;
  },

  // n log-spaced bands from 40 Hz to 16 kHz, each 0–255. Music carries far
  // less energy up high, so a +4.5 dB/octave tilt around 1 kHz levels the
  // display the way hardware analyzers do; the window is -72…-8 dB.
  spectrum(n) {
    const out = new Array(n).fill(0);
    if (!B.m || !B.m.isPlaying) return out;
    const an = analyser();
    if (!an) return out;
    an.getFloatFrequencyData(viz.buf);
    const hz = viz.ctx.sampleRate / an.fftSize;
    const lo = Math.log(40), hi = Math.log(16000);
    for (let i = 0; i < n; i++) {
      const f0 = Math.exp(lo + (hi - lo) * i / n), f1 = Math.exp(lo + (hi - lo) * (i + 1) / n);
      const a = Math.floor(f0 / hz), b = Math.max(a + 1, Math.floor(f1 / hz));
      let peak = -Infinity;
      for (let k = a; k < b && k < viz.buf.length; k++) peak = Math.max(peak, viz.buf[k]);
      const db = peak + 4.5 * Math.log2(Math.sqrt(f0 * f1) / 1000);
      out[i] = Math.round(255 * Math.max(0, Math.min(1, (db + 72) / 64)));
    }
    return out;
  },
});

// A command changes state a moment after it runs; tell the daemon then too.
for (const k of ['playIds', 'playStation', 'autoplay', 'toggle', 'play', 'pause', 'next', 'prev', 'jump', 'enqueue', 'seek',
                 'volume', 'shuffle', 'repeat', 'preview', 'stopPreview', 'setToken']) {
  const f = B[k];
  B[k] = function (...a) { const r = f.apply(B, a); touch(); setTimeout(touch, 300); return r; };
}
</script>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"
        onerror="window.brumm.err = 'could not load MusicKit JS'"></script>
</head>
<body></body>
</html>
